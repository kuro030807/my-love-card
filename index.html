<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ง้อแฟน 🥺</title>
  <!-- ดึงไลบรารี anime.js สำหรับทำอนิเมชันการเคลื่อนที่ขยับหนีว่องไว -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
    }
    body {
      background-color: #fce4ec;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 450px;
      padding: 35px 25px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(255, 182, 193, 0.4);
      text-align: center;
      position: relative;
    }
    .img-container {
      width: 200px;
      height: 200px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .title {
      font-size: 24px;
      color: #333;
      font-weight: bold;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .subtitle {
      font-size: 15px;
      color: #666;
      margin-bottom: 24px;
      line-height: 1.5;
      min-height: 48px;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      min-height: 60px;
    }
    .btn {
      padding: 12px 24px;
      border-radius: 30px;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      touch-action: manipulation;
    }
    .btn-yes {
      background-color: #f8bbd0;
      color: #c2185b;
      z-index: 10;
    }
    .btn-yes:hover {
      background-color: #f48fb1;
    }
    .btn-no {
      background-color: #f0f0f0;
      color: #757575;
      z-index: 100;
      position: relative;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="img-container">
      <img id="capooImg" src="https://media.tenor.com/Gp2PDF56kYcAAAAm/capoo-cat.webp" alt="Capoo">
    </div>
   
    <h2 id="mainTitle" class="title">ที่รัก...ยกโทษให้เค้าได้ไหม ?</h2>
    <p id="subTitle" class="subtitle">เค้ารู้ว่าครั้งนี้เค้าผิด แต่อยากขอโอกาสอีกครั้งจริงๆ นะ</p>
   
    <div class="btn-group" id="btnGroup">
      <button id="yesBtn" class="btn btn-yes" onclick="acceptApology()">🌸 ยกโทษ</button>
      <button id="noBtn" class="btn btn-no" onclick="refuseApology()">❌ ไม่ยกโทษ</button>
    </div>
  </div>

  <script>
    const steps = [
      {
        gif: "https://media.tenor.com/ML8iuahL1YAAAAAm/manhphongg.webp",
        title: "แน่ใจเหรอ...ไม่ใจอ่อนจริงๆ เหรอ 🥺",
        subtitle: "เค้าสัญญาว่าจะตั้งใจฟัง และไม่ทำให้เธอเสียใจแบบนี้อีกแล้ว",
        yesText: "🌸 เริ่มใจอ่อนแล้วนะ",
        noText: "❌ ยังไม่ยกโทษ"
      },
      {
        gif: "https://media.tenor.com/FCYXArk5DNYAAAAm/capoo-bugcat.webp",
        title: "เค้าง้อจริงๆ นะ...ง้อสุดหัวใจเลย",
        subtitle: "ไม่มีข้อแก้ตัวอะไรเลย มีแต่ความรู้สึกผิดกับความรักที่อยากดูแลเธอให้ดีกว่านี้",
        yesText: "🌸 ยกโทษให้ก็ได้...",
        noText: "❌ ยังงอนอยู่"
      },
      {
        gif: "https://media.tenor.com/BMj-yG8QvY4AAAAm/%E0%B9%80%E0%B8%A8%E0%B8%A3%E0%B9%89%E0%B8%B2-cry.webp",
        title: "ถ้ายังไม่ยกโทษ เค้าก็จะง้อต่อ!",
        subtitle: "เพราะเค้าไม่อยากเสียเธอไป และไม่อยากเดินต่อโดยไม่มีมือคู่นี้",
        yesText: "🌸 โอเค...ยกโทษให้ก็ได้",
        noText: "❌ ยังไม่!!!"
      },
      {
        gif: "https://media.tenor.com/ML8iuahL1YAAAAAm/manhphongg.webp",
        title: "ยอมแล้วก็ได้...แต่รักเธอจริงๆ นะ 💕",
        subtitle: "ต่อให้โดนกดไม่ยกโทษกี่รอบ เค้าก็อยากง้อเธอคนเดิมอยู่ดี",
        yesText: "🌸 ยกโทษให้เค้า",
        noText: "❌ ไม่เอาหรอก"
      },
      {
        gif: "https://media.tenor.com/Gp2PDF56kYcAAAAm/capoo-cat.webp",
        title: "โอมมม...จงใจอ่อน จงใจอ่อน ✨",
        subtitle: "เค้ารู้ว่าเธอเจ็บ แต่เค้าอยากตั้งใจแก้ไขมันจริงๆ นะครับ",
        yesText: "🌸 ใจอ่อนนิดนึงแล้ว",
        noText: "❌ ยังไม่หลงกล"
      },
      {
        gif: "https://media.tenor.com/FCYXArk5DNYAAAAm/capoo-bugcat.webp",
        title: "เค้ารักเธอนะ...รักมากๆ เลย 💖",
        subtitle: "ไม่มีวันไหนที่ไม่คิดถึง และไม่มีวันไหนที่ไม่เสียใจกับเรื่องที่เกิดขึ้น",
        yesText: "🌸 ยกโทษให้แล้วกัน",
        noText: "❌ ยังไม่หายโกรธ"
      },
      {
        gif: "https://media.tenor.com/BMj-yG8QvY4AAAAm/%E0%B9%80%E0%B8%A8%E0%B8%A3%E0%B9%89%E0%B8%B2-cry.webp",
        title: "อย่าใจร้ายเลยน้าาา...ตาบวมหมดแล้ว 😭",
        subtitle: "ขอโอกาสให้เค้าได้พิสูจน์ตัวเองอีกสักครั้งนะครับ",
        yesText: "🌸 ยกโทษให้น้า",
        noText: "❌ ไม่ใจอ่อนหรอก"
      },
      {
        gif: "https://media.tenor.com/ML8iuahL1YAAAAAm/manhphongg.webp",
        title: "ยังไม่ยอมจริงๆ เหรอเนี่ย 🥺",
        subtitle: "แต่ไม่เป็นไร เค้าพร้อมจะง้อเธอไปเรื่อยๆ จนกว่าเธอจะยิ้มได้",
        yesText: "🌸 แอบยิ้มละ ยกโทษให้",
        noText: "❌ ยังไม่ยิ้ม!"
      },
      {
        gif: "https://media.tenor.com/FCYXArk5DNYAAAAm/capoo-bugcat.webp",
        title: "จะกดไม่ยกโทษอีกกี่รอบ เค้าก็รักเธอ 💓",
        subtitle: "ให้เค้าได้ดูแลและรักษาหัวใจของเธออีกครั้งนะ",
        yesText: "🌸 ยกโทษให้จริงๆ แล้ว",
        noText: "❌ กดอีกรอบซิ!"
      },
      {
        gif: "https://media.tenor.com/BMj-yG8QvY4AAAAm/%E0%B9%80%E0%B8%A8%E0%B8%A3%E0%B9%89%E0%B8%B2-cry.webp",
        title: "กดครบ 10 รอบแล้วน้าาา! 💨",
        subtitle: "ทีนี้ปุ่มไม่ยกโทษจะวิ่งหนีแล้ว! แตะไม่ได้แล้วนะ ต้องกดยกโทษเท่านั้น!",
        yesText: "🌸 ยอมยกโทษให้ก็ได้! 💕",
        noText: "❌ ไม่เอาหรอก จะไม่ยกโทษ!"
      }
    ];

    const happyGif = "https://media.tenor.com/g9Giuumkl7kAAAAm/tkthao219-capoo.webp";
    let currentStep = 0;
    let clickCount = 0;

    const noBtn = document.getElementById('noBtn');

    function refuseApology() {
      clickCount++;
      const yesBtn = document.getElementById('yesBtn');

      if (currentStep < steps.length) {
        const data = steps[currentStep];
        document.getElementById('capooImg').src = data.gif;
        document.getElementById('mainTitle').innerText = data.title;
        document.getElementById('subTitle').innerText = data.subtitle;
        yesBtn.innerHTML = data.yesText;
        noBtn.innerHTML = data.noText;
        currentStep++;
      }
    }

    // ฟังก์ชันสั่งปุ่มสไลด์หลบด้วยความเร็วสูง
    function moveButtonFast() {
      if (clickCount >= 10) {
        noBtn.style.position = 'fixed';
        
        const padding = 20;
        const maxX = window.innerWidth - noBtn.offsetWidth - padding;
        const maxY = window.innerHeight - noBtn.offsetHeight - padding;

        const randomX = Math.max(padding, Math.random() * maxX);
        const randomY = Math.max(padding, Math.random() * maxY);

        anime({
          targets: noBtn,
          left: `${randomX}px`,
          top: `${randomY}px`,
          duration: 150, // ความเร็วในการสไลด์หนี (150ms ไวแต่เห็นอนิเมชันลื่นตา)
          easing: 'easeOutQuad'
        });
      }
    }

    // บนมือถือ: สั่งหนีทันที 0ms ที่สัมผัสโดนผิวปุ่ม (ยับยั้งคำสั่งคลิก)
    noBtn.addEventListener('touchstart', (e) => {
      if (clickCount >= 10) {
        e.preventDefault();
        moveButtonFast();
      }
    }, { passive: false });

    // บนคอมพิวเตอร์/โน้ตบุ๊ก: สั่งหนีทันทีที่เมาส์เลื่อนมาโดน
    noBtn.addEventListener('mouseover', () => {
      if (clickCount >= 10) {
        moveButtonFast();
      }
    });

    function acceptApology() {
      document.getElementById('capooImg').src = happyGif;
      document.getElementById('mainTitle').innerText = "ขอบคุณที่ยกโทษให้เค้านะ 💕";
      document.getElementById('subTitle').innerHTML = `
        เค้าอาจไม่ใช่คนดีที่สมบูรณ์แบบ แต่จะเป็นคนรักที่รักเธอให้ดีที่สุด<br>
        จากนี้เค้าจะระวังหัวใจของที่รักมากกว่านี้และไม่ปล่อยให้ต้องเสียใจง่ายๆ อีกแล้ว 💞<br><br>
        <strong>รักนะ และอยากจับมือไปด้วยกันต่อ</strong>
      `;
      document.getElementById('btnGroup').style.display = 'none';
      noBtn.style.display = 'none';
    }
  </script>
</body>
</html>
